[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointcloud-research-lab"
version = "0.2.0"
description = "Auditable nuScenes LiDAR preprocessing and 3D Point-BERT-inspired research workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "python-multipart>=0.0.9"]

[project.optional-dependencies]
research = ["torch>=2.1", "plotly>=5.18", "matplotlib>=3.8", "nuscenes-devkit>=1.1", "scikit-learn>=1.3", "nbformat>=5.9"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
